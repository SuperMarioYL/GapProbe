[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gapprobe"
version = "0.1.0"
description = "Capability-gap diagnostician for locally-served CN open-weights models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "SuperMarioYL" }]
keywords = ["llm", "diagnostics", "deepseek", "qwen", "local-llm", "cn-model", "chat-template", "sampling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13.7",
]

[project.optional-dependencies]
test = ["pytest>=8.2"]

[project.scripts]
gapprobe = "gapprobe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["gapprobe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
